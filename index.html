<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penyetara Reaksi Kimia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen antialiased">
    <div class="max-w-2xl mx-auto px-6 py-12">
        <header class="mb-8 pb-6 border-b border-stone-200">
            <h1 class="text-xl font-bold tracking-tight text-stone-900">Penyetara Reaksi Kimia</h1>
            <p class="text-stone-500 text-sm mt-1">Setarakan persamaan reaksi kimia instan dengan algoritma aljabar linear.</p>
        </header>

        <div class="bg-white border border-stone-200 p-6 rounded-xl shadow-sm mb-8">
            <label class="block text-xs font-semibold text-stone-600 uppercase tracking-wider mb-2">Persamaan Reaksi</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input id="inputEq" type="text" placeholder="Contoh: C2H6 + O2 -> CO2 + H2O atau C₂H₆ + O₂ → CO₂ + H₂O" 
                    value="C2H6 + O2 -> CO2 + H2O"
                    class="flex-1 px-4 py-2.5 bg-stone-50 border border-stone-300 rounded-lg text-stone-900 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-stone-900 focus:bg-white text-sm">
                <button onclick="balance()" class="px-5 py-2.5 bg-stone-900 hover:bg-stone-800 text-white font-medium rounded-lg text-sm transition">
                    Setarakan
                </button>
            </div>
        </div>

        <div id="resultBox" class="hidden bg-white border border-stone-200 p-6 rounded-xl shadow-sm space-y-4">
            <div>
                <span class="text-xs font-semibold text-stone-500 uppercase tracking-wider">Hasil Reaksi Setara:</span>
                <div id="balancedOutput" class="text-lg font-bold text-stone-900 mt-1 p-3 bg-stone-50 rounded-lg border border-stone-200/70 overflow-x-auto"></div>
            </div>
            <div id="stepDetails" class="text-sm text-stone-600 border-t border-stone-100 pt-3"></div>
        </div>

        <div id="errorBox" class="hidden p-4 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl"></div>
    </div>

    <script>
        function normalizeFormula(str) {
            const subMap = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
            return str.replace(/[₀₁₂₃₄₅₆₇₈₉]/g, m => subMap[m]);
        }

        function parseFormula(formula) {
            formula = normalizeFormula(formula.trim());
            let count = {};
            let regex = /([A-Z][a-z]*)(\d*)/g;
            
            while (formula.includes('(')) {
                formula = formula.replace(/\(([^()]+)\)(\d+)/g, (match, inner, mult) => {
                    let m = parseInt(mult, 10);
                    return inner.replace(/([A-Z][a-z]*)(\d*)/g, (sub, elem, num) => {
                        let n = num ? parseInt(num, 10) : 1;
                        return elem + (n * m);
                    });
                });
            }

            let match;
            while ((match = regex.exec(formula)) !== null) {
                let elem = match[1];
                let num = match[2] ? parseInt(match[2], 10) : 1;
                count[elem] = (count[elem] || 0) + num;
            }
            return count;
        }

        function gcd(a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            while (b) { let t = b; b = a % b; a = t; }
            return a;
        }

        function solveNullspace(matrix) {
            let rows = matrix.length;
            let cols = matrix[0].length;
            
            let mat = matrix.map(r => r.map(v => Number(v)));
            let lead = 0;
            for (let r = 0; r < rows; ++r) {
                if (lead >= cols - 1) break;
                let i = r;
                while (Math.abs(mat[i][lead]) < 1e-9) {
                    i++;
                    if (i === rows) {
                        i = r;
                        lead++;
                        if (lead === cols - 1) break;
                    }
                }
                if (lead >= cols - 1) break;
                
                let temp = mat[i]; mat[i] = mat[r]; mat[r] = temp;
                let val = mat[r][lead];
                for (let j = 0; j < cols; ++j) mat[r][j] /= val;
                for (let k = 0; k < rows; ++k) {
                    if (k !== r) {
                        let factor = mat[k][lead];
                        for (let j = 0; j < cols; ++j) mat[k][j] -= factor * mat[r][j];
                    }
                }
                lead++;
            }

            for (let target = 1; target <= 100; target++) {
                let coeffs = new Array(cols).fill(0);
                coeffs[cols - 1] = target;
                let valid = true;
                for (let r = rows - 1; r >= 0; r--) {
                    let firstLead = -1;
                    for (let c = 0; c < cols; c++) {
                        if (Math.abs(mat[r][c] - 1) < 1e-5 && firstLead === -1) {
                            firstLead = c;
                            break;
                        }
                    }
                    if (firstLead !== -1) {
                        let sum = 0;
                        for (let c = firstLead + 1; c < cols; c++) {
                            sum += mat[r][c] * coeffs[c];
                        }
                        let val = -sum;
                        let rounded = Math.round(val);
                        if (Math.abs(val - rounded) > 1e-4 || rounded <= 0) {
                            valid = false;
                            break;
                        }
                        coeffs[firstLead] = rounded;
                    }
                }
                if (valid && coeffs.every(c => c > 0)) {
                    let d = coeffs.reduce(gcd);
                    return coeffs.map(c => c / d);
                }
            }
            return null;
        }

        function balance() {
            let eq = document.getElementById('inputEq').value.trim();
            let resBox = document.getElementById('resultBox');
            let errBox = document.getElementById('errorBox');
            resBox.classList.add('hidden');
            errBox.classList.add('hidden');

            let parts = eq.split(/->|=|→/);
            if (parts.length !== 2) {
                errBox.textContent = "Format persamaan tidak valid. Gunakan tanda '->' atau '=' pemisah reaktan dan produk.";
                errBox.classList.remove('hidden');
                return;
            }

            let left = parts[0].split('+').map(s => s.trim()).filter(Boolean);
            let right = parts[1].split('+').map(s => s.trim()).filter(Boolean);

            if (left.length === 0 || right.length === 0) {
                errBox.textContent = "Reaktan dan produk tidak boleh kosong.";
                errBox.classList.remove('hidden');
                return;
            }

            let parsedLeft = left.map(parseFormula);
            let parsedRight = right.map(parseFormula);

            let elements = new Set();
            parsedLeft.forEach(obj => Object.keys(obj).forEach(k => elements.add(k)));
            parsedRight.forEach(obj => Object.keys(obj).forEach(k => elements.add(k)));
            let elemList = Array.from(elements);

            let cols = left.length + right.length;
            let matrix = [];

            elemList.forEach(elem => {
                let row = [];
                parsedLeft.forEach(obj => row.push(obj[elem] || 0));
                parsedRight.forEach(obj => row.push(-(obj[elem] || 0)));
                matrix.push(row);
            });

            let coeffs = solveNullspace(matrix);
            if (!coeffs) {
                errBox.textContent = "Tidak dapat menyetarakan persamaan ini. Pastikan unsur di kiri dan kanan konsisten.";
                errBox.classList.remove('hidden');
                return;
            }

            let formatTerm = (c, formula) => {
                let norm = normalizeFormula(formula);
                return (c > 1 ? c : '') + norm.replace(/(\d+)/g, '<sub>$1</sub>');
            };
            let leftStr = left.map((f, i) => formatTerm(coeffs[i], f)).join(' + ');
            let rightStr = right.map((f, i) => formatTerm(coeffs[left.length + i], f)).join(' + ');

            document.getElementById('balancedOutput').innerHTML = leftStr + ' &rarr; ' + rightStr;
            document.getElementById('stepDetails').innerHTML = `
                <p class="font-medium text-stone-800 mb-1">Daftar Koefisien:</p>
                <p>Reaktan: ${coeffs.slice(0, left.length).join(', ')}</p>
                <p>Produk: ${coeffs.slice(left.length).join(', ')}</p>
            `;
            resBox.classList.remove('hidden');
        }

        balance();
    </script>
</body>
</html>
